[versions]
detekt = "1.23.8"
detektifier = "0.2.0"
dokka = "2.2.0"
junit = "5.14.4"
junit-platform = "1.14.4"
kotlinx-serialization = "1.11.0"
kover = "0.9.11"
# @pin
# @keep lowest Kover version KoverGate supports; tested by functionalTestKoverMatrix
kover-floor = "0.9.9"
kovergate = "0.8.0"
ktfmt-gradle = "0.27.0"
sort-dependencies = "0.21.0"
vanniktech-maven-publish = "0.37.0"
version-catalog-update = "1.1.1"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
kotlinx-kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

[plugins]
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
detektifier = { id = "com.commonsware.detektifier", version.ref = "detektifier" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
dokka-javadoc = { id = "org.jetbrains.dokka-javadoc", version.ref = "dokka" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
ktfmt-gradle = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt-gradle" }
plugin-publish = { id = "com.gradle.plugin-publish", version = "2.1.1" }
sort-dependencies = { id = "com.squareup.sort-dependencies", version.ref = "sort-dependencies" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-maven-publish" }
version-catalog-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "version-catalog-update" }
