[versions]
detekt = "1.23.8"
detektifier = "0.1.3"
dokka = "2.2.0"
junit = "5.14.4"
junit-platform = "1.14.4"
kotlinx-serialization = "1.11.0"
kover = "0.9.8"
kovergate = "0.5.0"
ktfmt-gradle = "0.26.0"
sort-dependencies = "0.19.0"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
kotlinx-kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

[plugins]
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
detektifier = { id = "com.commonsware.detektifier", version.ref = "detektifier" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
dokka-javadoc = { id = "org.jetbrains.dokka-javadoc", version.ref = "dokka" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
ktfmt-gradle = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt-gradle" }
plugin-publish = { id = "com.gradle.plugin-publish", version = "2.1.1" }
sort-dependencies = { id = "com.squareup.sort-dependencies", version.ref = "sort-dependencies" }
